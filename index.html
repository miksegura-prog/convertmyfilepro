    <!-- Monetag + push service worker: only for FREE visitors.
         PRO users (localStorage `convertmyfilepro_pro` active and not expired) get no ads,
         including Monetag vignette and push notifications. See src/hooks/useProStatus.ts. -->
    <script>
      (function () {
        var PRO_KEY = 'convertmyfilepro_pro';
        var isPro = false;

        try {
          var stored = localStorage.getItem(PRO_KEY);
          if (stored) {
            var parsed = JSON.parse(stored);
            isPro = !!(parsed && parsed.active && parsed.expiresAt && parsed.expiresAt > Date.now());
          }
        } catch (e) {
          isPro = false;
        }

        // Never serve ads on the checkout-return page while PRO is being verified.
        var verifyingPayment = window.location.pathname.indexOf('/pro-success') === 0;

        // OWNER BETA: en desarrollo local (npm run dev) no cargamos anuncios.
        // Esto NO concede ninguna prestación PRO; solo evita publicidad en el
        // entorno autorizado del desarrollador.
        var localDevHost =
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          window.location.hostname === '[::1]';

        var adFree = isPro || localDevHost;

        if (!adFree && !verifyingPayment) {
          (function (s) {
            s.dataset.zone = '12234686';
            s.src = 'https://n6wxm.com/vignette.min.js';
          })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
        }

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            if (isPro || localDevHost) {
              // Remove the Monetag push service worker for PRO users and local dev.
              navigator.serviceWorker.getRegistrations().then(function (registrations) {
                registrations.forEach(function (registration) {
                  var worker = registration.active || registration.installing || registration.waiting;
                  if (worker && worker.scriptURL.indexOf('/sw.js') !== -1) {
                    registration.unregister();
                  }
                });
              }).catch(function () {});
              return;
            }

            navigator.serviceWorker.register('/sw.js')
              .then(function (registration) {
                console.log('SW registered:', registration);
              })
              .catch(function (error) {
                console.log('SW registration failed:', error);
              });
          });
        }
      })();
    </script>
