    <!-- External advertising networks have been disabled.
         On all pages, remove any old Monetag push subscription and its
         legacy /sw.js registration, which may persist after deployment.
         Do not unregister unrelated service workers. -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            var worker = registration.active || registration.waiting || registration.installing;
            if (!worker) return;
            try {
              var workerUrl = new URL(worker.scriptURL);
              if (workerUrl.origin !== location.origin || workerUrl.pathname !== '/sw.js') return;
            } catch (_) { return; }
            var unsubscribe = registration.pushManager
              ? registration.pushManager.getSubscription().then(function (subscription) {
                  if (subscription) return subscription.unsubscribe();
                }).catch(function () {})
              : Promise.resolve();
            unsubscribe.finally(function () {
              registration.unregister().catch(function () {});
            });
          });
        }).catch(function () {});
      })();
