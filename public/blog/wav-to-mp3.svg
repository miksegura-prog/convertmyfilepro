<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="wav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="wav-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#wav-bg)"/>
  <circle cx="400" cy="250" r="180" fill="url(#wav-glow)" opacity="0.4"/>
  <!-- Sound wave visualizer -->
  <g transform="translate(200, 200)">
    <rect x="0" y="40" width="12" height="20" rx="6" fill="#c4b5fd" opacity="0.7">
      <animate attributeName="height" values="20;60;20" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="20" width="12" height="60" rx="6" fill="#ddd6fe" opacity="0.9">
      <animate attributeName="height" values="60;30;60" dur="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="10" width="12" height="80" rx="6" fill="#ede9fe">
      <animate attributeName="height" values="80;40;80" dur="0.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="25" width="12" height="50" rx="6" fill="#ddd6fe" opacity="0.9">
      <animate attributeName="height" values="50;70;50" dur="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="96" y="35" width="12" height="30" rx="6" fill="#c4b5fd" opacity="0.7">
      <animate attributeName="height" values="30;55;30" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="15" width="12" height="70" rx="6" fill="#ede9fe">
      <animate attributeName="height" values="70;35;70" dur="0.65s" repeatCount="indefinite"/>
    </rect>
    <rect x="144" y="5" width="12" height="90" rx="6" fill="#f5f3ff">
      <animate attributeName="height" values="90;45;90" dur="0.75s" repeatCount="indefinite"/>
    </rect>
    <rect x="168" y="30" width="12" height="40" rx="6" fill="#ddd6fe" opacity="0.9">
      <animate attributeName="height" values="40;65;40" dur="0.55s" repeatCount="indefinite"/>
    </rect>
    <rect x="192" y="20" width="12" height="60" rx="6" fill="#c4b5fd" opacity="0.7">
      <animate attributeName="height" values="60;25;60" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="216" y="40" width="12" height="20" rx="6" fill="#ede9fe">
      <animate attributeName="height" values="20;50;20" dur="0.7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- MP3 badge -->
  <g transform="translate(340, 360)">
    <rect x="0" y="0" width="120" height="40" rx="20" fill="#f59e0b"/>
    <text x="60" y="26" font-family="Arial Black, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">MP3</text>
  </g>
  <!-- Floating notes -->
  <g fill="#fcd34d" opacity="0.6">
    <text x="120" y="100" font-size="28">♪</text>
    <text x="650" y="130" font-size="36">♫</text>
    <text x="90" y="380" font-size="22">♩</text>
    <text x="680" y="380" font-size="30">♪</text>
  </g>
  <!-- Converter arrow -->
  <g transform="translate(300, 120)">
    <path d="M0 0 L200 0 L180 -15 M200 0 L180 15" stroke="#fbbf24" stroke-width="4" fill="none"/>
  </g>
  <text x="400" y="105" font-family="Arial, sans-serif" font-size="16" fill="#fde68a" text-anchor="middle" opacity="0.9">WAV</text>
  <text x="400" y="185" font-family="Arial, sans-serif" font-size="16" fill="#fde68a" text-anchor="middle" opacity="0.9">MP3</text>
</svg>