<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="img-pdf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#img-pdf-bg)"/>
  <!-- Images on the left -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="140" height="100" rx="8" fill="white" opacity="0.9"/>
    <rect x="5" y="5" width="130" height="90" rx="6" fill="#fef3c7"/>
    <circle cx="70" cy="50" r="20" fill="#f59e0b" opacity="0.4"/>
    <rect x="20" y="35" width="40" height="30" rx="4" fill="#fbbf24" opacity="0.3"/>
    <text x="70" y="125" font-family="Arial, sans-serif" font-size="11" fill="#ccfbf1" text-anchor="middle">JPG / PNG</text>
  </g>
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="140" height="100" rx="8" fill="white" opacity="0.9"/>
    <rect x="5" y="5" width="130" height="90" rx="6" fill="#dbeafe"/>
    <circle cx="70" cy="50" r="20" fill="#3b82f6" opacity="0.4"/>
    <rect x="15" y="60" width="60" height="8" rx="3" fill="#93c5fd" opacity="0.6"/>
    <text x="70" y="125" font-family="Arial, sans-serif" font-size="11" fill="#ccfbf1" text-anchor="middle">JPG / PNG</text>
  </g>
  <g transform="translate(60, 340)">
    <rect x="0" y="0" width="140" height="100" rx="8" fill="white" opacity="0.9"/>
    <rect x="5" y="5" width="130" height="90" rx="6" fill="#fce7f3"/>
    <circle cx="70" cy="50" r="20" fill="#ec4899" opacity="0.4"/>
    <rect x="25" y="35" width="50" height="10" rx="3" fill="#f9a8d4" opacity="0.5"/>
    <text x="70" y="125" font-family="Arial, sans-serif" font-size="11" fill="#ccfbf1" text-anchor="middle">JPG / PNG</text>
  </g>
  <!-- Arrow -->
  <g transform="translate(220, 260)">
    <path d="M0 0 L80 0 L60 -12 M80 0 L60 12" stroke="#5eead4" stroke-width="3" fill="none"/>
  </g>
  <!-- Result PDF with pages -->
  <g transform="translate(360, 100)">
    <rect x="0" y="0" width="160" height="280" rx="8" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="160" height="45" rx="8" fill="#14b8a6"/>
    <text x="80" y="29" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">PDF</text>
    <rect x="20" y="65" width="120" height="30" rx="4" fill="#fef3c7"/>
    <text x="80" y="84" font-family="Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">Foto 1</text>
    <rect x="20" y="105" width="120" height="30" rx="4" fill="#dbeafe"/>
    <text x="80" y="124" font-family="Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle">Foto 2</text>
    <rect x="20" y="145" width="120" height="30" rx="4" fill="#fce7f3"/>
    <text x="80" y="164" font-family="Arial, sans-serif" font-size="9" fill="#db2777" text-anchor="middle">Foto 3</text>
    <rect x="20" y="185" width="120" height="30" rx="4" fill="#fef3c7"/>
    <text x="80" y="204" font-family="Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">Foto 4</text>
    <rect x="20" y="225" width="120" height="30" rx="4" fill="#dbeafe"/>
    <text x="80" y="244" font-family="Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle">Foto 5</text>
  </g>
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="15" fill="#ccfbf1" text-anchor="middle">Múltiples imágenes en un solo PDF • Conversión por lotes</text>
</svg>