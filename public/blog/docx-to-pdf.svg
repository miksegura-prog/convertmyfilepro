<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="docx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="pdf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#docx-bg)"/>
  <!-- Word document -->
  <g transform="translate(130, 100)">
    <rect x="0" y="0" width="180" height="240" rx="8" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="180" height="50" rx="8" fill="#2b5797"/>
    <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">WORD</text>
    <line x1="20" y1="75" x2="160" y2="75" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="20" y1="100" x2="140" y2="100" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="20" y1="125" x2="150" y2="125" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="20" y1="150" x2="130" y2="150" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="20" y1="175" x2="155" y2="175" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="20" y1="200" x2="100" y2="200" stroke="#cbd5e1" stroke-width="2"/>
    <text x="90" y="230" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">DOCX</text>
  </g>
  <!-- Arrow right -->
  <g transform="translate(340, 200)">
    <path d="M0 20 L100 20 L80 5 M100 20 L80 35" stroke="#93c5fd" stroke-width="4" fill="none"/>
    <circle cx="120" cy="20" r="6" fill="#93c5fd"/>
  </g>
  <!-- PDF document -->
  <g transform="translate(490, 100)">
    <rect x="0" y="0" width="180" height="240" rx="8" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="180" height="50" rx="8" fill="url(#pdf-grad)"/>
    <text x="90" y="32" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">PDF</text>
    <line x1="20" y1="75" x2="160" y2="75" stroke="#fecaca" stroke-width="2"/>
    <line x1="20" y1="100" x2="140" y2="100" stroke="#fecaca" stroke-width="2"/>
    <line x1="20" y1="125" x2="150" y2="125" stroke="#fecaca" stroke-width="2"/>
    <line x1="20" y1="150" x2="130" y2="150" stroke="#fecaca" stroke-width="2"/>
    <line x1="20" y1="175" x2="155" y2="175" stroke="#fecaca" stroke-width="2"/>
    <line x1="20" y1="200" x2="100" y2="200" stroke="#fecaca" stroke-width="2"/>
    <text x="90" y="230" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">PDF</text>
  </g>
  <!-- Floating checkmark -->
  <g transform="translate(450, 100)">
    <circle cx="0" cy="0" r="20" fill="#22c55e"/>
    <path d="M-8 0 L-3 6 L8 -6" stroke="white" stroke-width="3" fill="none"/>
  </g>
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="16" fill="#bfdbfe" text-anchor="middle">Sin instalar Word • 100% en tu navegador</text>
</svg>