<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="ocr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#ocr-bg)"/>
  <!-- Document with text extraction -->
  <g transform="translate(180, 80)">
    <!-- Document being scanned -->
    <rect x="0" y="0" width="200" height="280" rx="8" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="200" height="45" rx="8" fill="#06b6d4"/>
    <text x="100" y="29" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">DOCUMENTO</text>
    <!-- Text lines -->
    <rect x="20" y="65" width="90" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="20" y="85" width="140" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="20" y="105" width="110" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="20" y="125" width="150" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="20" y="145" width="60" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="20" y="175" width="130" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="20" y="195" width="100" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="20" y="215" width="140" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="20" y="235" width="80" height="8" rx="4" fill="#e5e7eb"/>
    <!-- Photo on document -->
    <rect x="130" y="60" width="50" height="55" rx="4" fill="#fef3c7"/>
    <circle cx="155" cy="78" r="10" fill="#f59e0b" opacity="0.5"/>
  </g>
  <!-- Laser beam -->
  <line x1="180" y1="130" x2="420" y2="130" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8,4">
    <animate attributeName="x1" values="180;260" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="420;340" dur="2s" repeatCount="indefinite"/>
  </line>
  <!-- Extracted text floating -->
  <g transform="translate(460, 80)" opacity="0.9">
    <text x="0" y="20" font-family="monospace, Courier" font-size="13" fill="#a5f3fc">Texto extraído:</text>
    <text x="0" y="45" font-family="monospace, Courier" font-size="12" fill="#cffafe">"Lorem ipsum dolor sit</text>
    <text x="0" y="65" font-family="monospace, Courier" font-size="12" fill="#cffafe">amet, consectetur</text>
    <text x="0" y="85" font-family="monospace, Courier" font-size="12" fill="#cffafe">adipiscing elit..."</text>
  </g>
  <!-- Magnifying glass -->
  <g transform="translate(620, 250)">
    <circle cx="25" cy="25" r="22" stroke="#22d3ee" stroke-width="4" fill="none"/>
    <line x1="42" y1="42" x2="60" y2="60" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <text x="25" y="31" font-family="Arial, sans-serif" font-size="18" fill="#22d3ee" text-anchor="middle">Aa</text>
  </g>
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="15" fill="#a5f3fc" text-anchor="middle">Reconocimiento Óptico de Caracteres (OCR) • Múltiples idiomas</text>
</svg>