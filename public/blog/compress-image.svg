<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="compress-img-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#compress-img-bg)"/>
  <!-- Scale/gauge -->
  <g transform="translate(100, 80)">
    <path d="M0 200 A180 180 0 0 1 360 200" stroke="#c7d2fe" stroke-width="8" fill="none" opacity="0.3"/>
    <path d="M0 200 A180 180 0 0 1 300 200" stroke="#818cf8" stroke-width="8" fill="none" stroke-dasharray="12,6">
      <animate attributeName="stroke-dashoffset" values="0;-100" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Gauge needle -->
    <line x1="180" y1="200" x2="130" y2="60" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 180 200; -30 180 200; 0 180 200" dur="4s" repeatCount="indefinite"/>
    </line>
    <circle cx="180" cy="200" r="15" fill="#818cf8"/>
    <text x="180" y="205" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">KB</text>
    <text x="50" y="180" font-family="Arial, sans-serif" font-size="20" fill="#c7d2fe" font-weight="bold">Original</text>
    <text x="310" y="180" font-family="Arial, sans-serif" font-size="20" fill="#22c55e" font-weight="bold">80%</text>
  </g>
  <!-- Before/After images -->
  <g transform="translate(60, 300)">
    <rect x="0" y="0" width="150" height="120" rx="10" fill="white" opacity="0.9"/>
    <rect x="5" y="5" width="140" height="110" rx="8" fill="#e5e7eb"/>
    <text x="75" y="65" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">2.4 MB</text>
  </g>
  <g transform="translate(240, 300)">
    <path d="M0 60 L20 40 L30 60 L50 30 L60 60 L70 45 L80 60 L90 20 L100 60 L110 35 L120 60 L140 60" stroke="#22c55e" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(300, 300)">
    <rect x="0" y="0" width="150" height="120" rx="10" fill="white" opacity="0.9"/>
    <rect x="5" y="5" width="140" height="110" rx="8" fill="#f0fdf4"/>
    <text x="75" y="65" font-family="Arial, sans-serif" font-size="12" fill="#22c55e" text-anchor="middle">480 KB</text>
  </g>
  <g transform="translate(500, 320)">
    <rect x="0" y="0" width="200" height="60" rx="30" fill="#22c55e"/>
    <text x="100" y="36" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Calidad intacta ✓</text>
  </g>
  <!-- Floating percentages -->
  <text x="680" y="140" font-family="Arial, sans-serif" font-size="40" fill="#22c55e" font-weight="bold" opacity="0.8">80%</text>
  <text x="680" y="180" font-family="Arial, sans-serif" font-size="14" fill="#a5b4fc">menos peso</text>
  <text x="400" y="470" font-family="Arial, sans-serif" font-size="15" fill="#c7d2fe" text-anchor="middle">Comprime hasta un 80% sin perder nitidez visible</text>
</svg>