<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="split-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#split-bg)"/>
  <!-- Original PDF -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="160" height="280" rx="8" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="160" height="45" rx="8" fill="#f97316"/>
    <text x="80" y="29" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="bold">PDF ORIGINAL</text>
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">Página 1</text>
    <line x1="20" y1="85" x2="140" y2="85" stroke="#fed7aa" stroke-width="1.5"/>
    <line x1="20" y1="105" x2="120" y2="105" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="20" y="135" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">Página 2</text>
    <line x1="20" y1="145" x2="130" y2="145" stroke="#fed7aa" stroke-width="1.5"/>
    <line x1="20" y1="165" x2="110" y2="165" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="20" y="195" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">Página 3</text>
    <line x1="20" y1="205" x2="135" y2="205" stroke="#fed7aa" stroke-width="1.5"/>
    <line x1="20" y1="225" x2="125" y2="225" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="20" y="255" font-family="Arial, sans-serif" font-size="10" fill="#9ca3af">Página 4</text>
    <line x1="20" y1="265" x2="115" y2="265" stroke="#fed7aa" stroke-width="1.5"/>
  </g>
  <!-- Scissors -->
  <g transform="translate(280, 230)">
    <path d="M0 0 L40 50 M40 0 L0 50" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="8" fill="#fcd34d"/>
    <circle cx="40" cy="0" r="8" fill="#fcd34d"/>
  </g>
  <!-- Split result pages -->
  <g transform="translate(370, 50)">
    <rect x="0" y="0" width="110" height="160" rx="6" fill="white" opacity="0.85"/>
    <rect x="0" y="0" width="110" height="30" rx="6" fill="#fb923c"/>
    <text x="55" y="21" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Pág 01</text>
    <line x1="15" y1="50" x2="95" y2="50" stroke="#fed7aa" stroke-width="1.5"/>
    <line x1="15" y1="70" x2="80" y2="70" stroke="#fed7aa" stroke-width="1.5"/>
  </g>
  <g transform="translate(370, 230)">
    <rect x="0" y="0" width="110" height="160" rx="6" fill="white" opacity="0.85"/>
    <rect x="0" y="0" width="110" height="30" rx="6" fill="#fb923c"/>
    <text x="55" y="21" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Pág 02</text>
    <line x1="15" y1="50" x2="85" y2="50" stroke="#fed7aa" stroke-width="1.5"/>
    <line x1="15" y1="70" x2="90" y2="70" stroke="#fed7aa" stroke-width="1.5"/>
  </g>
  <g transform="translate(540, 50)">
    <rect x="0" y="0" width="110" height="160" rx="6" fill="white" opacity="0.85"/>
    <rect x="0" y="0" width="110" height="30" rx="6" fill="#fb923c"/>
    <text x="55" y="21" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Pág 03</text>
    <line x1="15" y1="50" x2="80" y2="50" stroke="#fed7aa" stroke-width="1.5"/>
    <line x1="15" y1="70" x2="95" y2="70" stroke="#fed7aa" stroke-width="1.5"/>
  </g>
  <g transform="translate(540, 230)">
    <rect x="0" y="0" width="110" height="160" rx="6" fill="white" opacity="0.85"/>
    <rect x="0" y="0" width="110" height="30" rx="6" fill="#fb923c"/>
    <text x="55" y="21" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Pág 04</text>
    <line x1="15" y1="50" x2="90" y2="50" stroke="#fed7aa" stroke-width="1.5"/>
    <line x1="15" y1="70" x2="75" y2="70" stroke="#fed7aa" stroke-width="1.5"/>
  </g>
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="15" fill="#fed7aa" text-anchor="middle">Divide PDFs por páginas o rangos • Descarga cada sección por separado</text>
</svg>