<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="xlsx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#86efac" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#xlsx-bg)"/>
  <!-- Excel grid -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="280" height="320" rx="10" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="280" height="45" rx="10" fill="#217346"/>
    <text x="140" y="29" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">EXCEL</text>
    <!-- Grid lines -->
    <line x1="0" y1="65" x2="280" y2="65" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="0" y1="115" x2="280" y2="115" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="0" y1="165" x2="280" y2="165" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="0" y1="215" x2="280" y2="215" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="0" y1="265" x2="280" y2="265" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="93" y1="45" x2="93" y2="320" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="187" y1="45" x2="187" y2="320" stroke="#e5e7eb" stroke-width="1"/>
    <!-- Data -->
    <text x="20" y="90" font-family="Arial, sans-serif" font-size="12" fill="#374151">Ene</text>
    <text x="110" y="90" font-family="Arial, sans-serif" font-size="12" fill="#374151">$45K</text>
    <text x="205" y="90" font-family="Arial, sans-serif" font-size="12" fill="#22c55e">↑12%</text>
    <text x="20" y="140" font-family="Arial, sans-serif" font-size="12" fill="#374151">Feb</text>
    <text x="110" y="140" font-family="Arial, sans-serif" font-size="12" fill="#374151">$52K</text>
    <text x="205" y="140" font-family="Arial, sans-serif" font-size="12" fill="#22c55e">↑16%</text>
    <text x="20" y="190" font-family="Arial, sans-serif" font-size="12" fill="#374151">Mar</text>
    <text x="110" y="190" font-family="Arial, sans-serif" font-size="12" fill="#374151">$61K</text>
    <text x="205" y="190" font-family="Arial, sans-serif" font-size="12" fill="#22c55e">↑18%</text>
  </g>
  <!-- Chart bar -->
  <g transform="translate(440, 160)">
    <rect x="0" y="80" width="30" height="120" rx="4" fill="#4ade80" opacity="0.6"/>
    <rect x="40" y="50" width="30" height="150" rx="4" fill="#22c55e" opacity="0.7"/>
    <rect x="80" y="30" width="30" height="170" rx="4" fill="#16a34a" opacity="0.8"/>
    <rect x="120" y="60" width="30" height="140" rx="4" fill="#4ade80" opacity="0.6"/>
    <rect x="160" y="20" width="30" height="180" rx="4" fill="#22c55e" opacity="0.7"/>
    <line x1="0" y1="200" x2="200" y2="200" stroke="#86efac" stroke-width="2"/>
  </g>
  <!-- Arrow to PDF -->
  <g transform="translate(420, 380)">
    <path d="M-40 0 L40 0 L20 -12 M40 0 L20 12" stroke="#86efac" stroke-width="3" fill="none"/>
  </g>
  <text x="400" y="430" font-family="Arial, sans-serif" font-size="15" fill="#bbf7d0" text-anchor="middle">Convierte XLSX a PDF con tablas y gráficos intactos</text>
</svg>