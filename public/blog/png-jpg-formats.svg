<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="png-jpg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#a21caf" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#png-jpg-bg)"/>
  <!-- PNG side -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="200" height="280" rx="12" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="200" height="50" rx="12" fill="#d946ef"/>
    <text x="100" y="33" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">PNG</text>
    <!-- Checkerboard transparency pattern -->
    <rect x="20" y="70" width="160" height="140" rx="8" fill="white"/>
    <g fill="#e5e7eb">
      <rect x="20" y="70" width="20" height="20"/>
      <rect x="60" y="70" width="20" height="20"/>
      <rect x="100" y="70" width="20" height="20"/>
      <rect x="140" y="70" width="20" height="20"/>
      <rect x="40" y="90" width="20" height="20"/>
      <rect x="80" y="90" width="20" height="20"/>
      <rect x="120" y="90" width="20" height="20"/>
      <rect x="160" y="90" width="20" height="20"/>
      <rect x="20" y="110" width="20" height="20"/>
      <rect x="60" y="110" width="20" height="20"/>
      <rect x="100" y="110" width="20" height="20"/>
      <rect x="140" y="110" width="20" height="20"/>
      <rect x="40" y="130" width="20" height="20"/>
      <rect x="80" y="130" width="20" height="20"/>
      <rect x="120" y="130" width="20" height="20"/>
      <rect x="160" y="130" width="20" height="20"/>
      <rect x="20" y="150" width="20" height="20"/>
      <rect x="60" y="150" width="20" height="20"/>
      <rect x="100" y="150" width="20" height="20"/>
      <rect x="140" y="150" width="20" height="20"/>
      <rect x="40" y="170" width="20" height="20"/>
      <rect x="80" y="170" width="20" height="20"/>
      <rect x="120" y="170" width="20" height="20"/>
      <rect x="160" y="170" width="20" height="20"/>
      <rect x="20" y="190" width="20" height="20"/>
      <rect x="60" y="190" width="20" height="20"/>
      <rect x="100" y="190" width="20" height="20"/>
      <rect x="140" y="190" width="20" height="20"/>
    </g>
    <!-- Star/logo on transparent -->
    <polygon points="100,85 108,108 133,108 113,123 120,148 100,133 80,148 87,123 67,108 92,108" fill="#d946ef" opacity="0.6"/>
    <text x="100" y="250" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Transparencia (Alfa)</text>
  </g>
  <!-- Bidirectional arrows -->
  <g transform="translate(310, 240)">
    <path d="M0 0 L40 0 L30 -10 M40 0 L30 10" stroke="#f5d0fe" stroke-width="3" fill="none"/>
    <text x="-10" y="-15" font-family="Arial, sans-serif" font-size="10" fill="#f5d0fe">&larr; Convertir &rarr;</text>
  </g>
  <g transform="translate(310, 200)">
    <path d="M0 0 L-40 0 L-30 -10 M-40 0 L-30 10" stroke="#f5d0fe" stroke-width="3" fill="none"/>
  </g>
  <!-- JPG side -->
  <g transform="translate(460, 100)">
    <rect x="0" y="0" width="200" height="280" rx="12" fill="white" opacity="0.95"/>
    <rect x="0" y="0" width="200" height="50" rx="12" fill="#f59e0b"/>
    <text x="100" y="33" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">JPG</text>
    <!-- Photo landscape -->
    <rect x="20" y="70" width="160" height="140" rx="8" fill="#fef3c7"/>
    <!-- Sky -->
    <rect x="20" y="70" width="160" height="60" rx="8" fill="#93c5fd" opacity="0.5"/>
    <!-- Sun -->
    <circle cx="140" cy="95" r="18" fill="#f59e0b" opacity="0.6"/>
    <!-- Mountains -->
    <polygon points="20,140 60,100 100,140" fill="#86efac" opacity="0.5"/>
    <polygon points="80,140 130,90 180,140" fill="#4ade80" opacity="0.4"/>
    <text x="100" y="250" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Fotografías y paisajes</text>
  </g>
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="15" fill="#f5d0fe" text-anchor="middle">¿PNG o JPG? Convierte al instante entre ambos formatos según tu necesidad</text>
</svg>